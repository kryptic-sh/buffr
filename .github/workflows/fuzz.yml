name: Fuzz

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_target_keybind
          - fuzz_target_keys
          - fuzz_target_config_toml
          - fuzz_target_console_sentinel
          - fuzz_target_netscape_import

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # `buffr-core` is in the fuzz graph (the console-sentinel target
      # drives its parsers), and on Linux it pulls the Wayland
      # idle-inhibit backend, whose `wayland-sys` build script shells out
      # to `pkg-config --libs --cflags wayland-client` and panics if it is
      # missing. `libsqlite3-sys` comes in via `buffr-bookmarks` but uses
      # the `bundled` feature, so it needs only a C compiler.
      - name: install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev

      - name: install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: cache cargo registry + fuzz target dir
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.toml', 'fuzz/fuzz_targets/*.rs') }}
          restore-keys: fuzz-${{ matrix.target }}-

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: seed corpus
        run: |
          if [ -d "fuzz/seeds/${{ matrix.target }}" ]; then
            mkdir -p "fuzz/corpus/${{ matrix.target }}"
            cp "fuzz/seeds/${{ matrix.target }}"/* "fuzz/corpus/${{ matrix.target }}"/
            echo "seeded corpus with $(ls "fuzz/seeds/${{ matrix.target }}" | wc -l) inputs"
          else
            echo "no committed seeds for ${{ matrix.target }}"
          fi

      - name: run fuzzer
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} \
            -- -max_total_time=600 -timeout=25 -rss_limit_mb=2048

      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
