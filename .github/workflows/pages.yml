name: Pages

# Single GitHub Pages deploy serving both:
#   - Marketing site at https://buffr.kryptic.sh/   (sourced from web/)
#   - Docs (mdBook)    at https://buffr.kryptic.sh/docs/
#
# Triggers:
#   - tag push (v*)        → marketing version rebakes from latest tag
#   - main + web/**        → marketing copy edits redeploy with current tag
#   - main + docs/**       → docs rebuild redeploys
#   - workflow_dispatch    → manual rebuild (e.g. after tag retag)
#
# A repo only gets one Pages site, so this workflow owns it. Custom domain
# (buffr.kryptic.sh) is configured in repo Settings → Pages → Custom domain
# AND via the CNAME file written into the artifact below — both must agree.

on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/**'
      - 'book.toml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'docs/**'
      - 'book.toml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need full history for `git describe`

      - name: Resolve latest release tag
        id: ver
        run: |
          set -euo pipefail
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.0.0")
          ver="${tag#v}"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Latest release: $tag (version=$ver)"

      - name: Substitute version into marketing HTML
        run: |
          set -euo pipefail
          sed -i "s/__VERSION__/${{ steps.ver.outputs.version }}/g" web/index.html
          # Confirm no placeholders left behind
          if grep -q "__VERSION__" web/index.html; then
            echo "::error::Stale __VERSION__ markers remain in web/index.html"
            exit 1
          fi

      - name: Install mdBook
        run: |
          set -euo pipefail
          version="0.4.40"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${version}/mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint SUMMARY.md parses
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r path; do
            if [ -n "$path" ] && [ ! -f "docs/$path" ]; then
              echo "::error::SUMMARY.md references missing file: docs/$path"
              missing=1
            fi
          done < <(grep -oE '\(\./[^)]+\)' docs/SUMMARY.md | sed 's/(\.\///;s/)$//')
          test "$missing" -eq 0

      - name: Build mdBook
        run: mdbook build

      - name: Assemble combined site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          # Marketing at root
          cp -a web/. site/
          # Docs under /docs/
          mkdir -p site/docs
          cp -a docs-site/. site/docs/
          # CNAME wins over per-source CNAMEs (web/CNAME may already exist)
          echo "buffr.kryptic.sh" > site/CNAME
          # Disable Jekyll on the deployed artifact
          touch site/.nojekyll
          ls -la site/
          ls -la site/docs/ | head

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
