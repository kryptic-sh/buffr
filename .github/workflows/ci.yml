name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

concurrency:
  group:
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    # fmt + clippy split out of the `linux` job so they run in parallel
    # with build+test+smoke. Workspace clippy is the slow half of the
    # original combined job (~60-90s); pulling it onto its own runner
    # cuts the critical path even though it costs a duplicated CEF +
    # rust toolchain setup. Uses a separate Swatinem shared-key so the
    # parallel job doesn't fight `linux-build` for the same cache.
    #
    # Matrix across 3 OSes so clippy catches lints inside
    # `#[cfg(target_os = "windows")]` / `#[cfg(target_os = "macos")]`
    # blocks (idle-inhibit backends in buffr-core, Windows job-object
    # plumbing in apps/buffr) that an ubuntu-only run silently skips.
    # See issue #156.
    name: lint (fmt + clippy) ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cef_platform: linux64
          - os: macos-latest
            cef_platform: macosarm64
          - os: windows-latest
            cef_platform: windows64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CEF_PATH: ${{ github.workspace }}/vendor/cef/${{ matrix.cef_platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: install CEF runtime deps (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libxshmfence1 \
            libdrm2 libgbm1 libpango-1.0-0 libasound2-dev \
            libx11-xcb1 libxcb-dri3-0 libcups2 libxss1 libxtst6 \
            libgl1 libegl1 libgles2 \
            libglib2.0-dev

      - name: install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: false
      - run: rustup update --no-self-update stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint-${{ matrix.os }}

      - name: cache CEF binary distribution
        uses: actions/cache@v5
        with:
          path: vendor/cef
          key:
            cef-${{ matrix.cef_platform }}-${{ hashFiles('xtask/src/main.rs')
            }}

      - name: fetch CEF
        run: cargo xtask fetch-cef

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # apps/buffr-app pulls `wayr` (Wayland-only) + enables
      # `buffr-modal/wayr` unconditionally, which transitively forces
      # `wayland-sys` to build. `wayland-sys`'s build script does a
      # pkg-config probe that has no chance on macOS / Windows runners,
      # so we exclude buffr-app from clippy on non-linux. The remaining
      # workspace members (buffr / buffr-helper / buffr-core /
      # buffr-cef / buffr-engine / buffr-config) are intended to compile
      # cross-platform and carry the `#[cfg(target_os = "windows")]` /
      # `#[cfg(target_os = "macos")]` blocks that motivated #156.
      - name: cargo clippy
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cargo clippy --workspace --all-targets -- -D warnings
          else
            cargo clippy --workspace --exclude buffr-app --all-targets -- -D warnings
          fi

  linux:
    name: linux build + test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CEF_PATH: ${{ github.workspace }}/vendor/cef/linux64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: install CEF runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libxshmfence1 \
            libdrm2 libgbm1 libpango-1.0-0 libasound2-dev \
            libx11-xcb1 libxcb-dri3-0 libcups2 libxss1 libxtst6 \
            libgl1 libegl1 libgles2 \
            libglib2.0-dev

      - name: install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-build

      - name: cache CEF binary distribution
        uses: actions/cache@v5
        with:
          path: vendor/cef
          key: cef-linux64-${{ hashFiles('xtask/src/main.rs') }}

      - name: fetch CEF
        run: cargo xtask fetch-cef

      - name: install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo build
        run: cargo build --workspace

      # nextest replaces `cargo test` for unit/integration tests. Process
      # per test binary + smart scheduling typically beats the stock
      # runner on multi-crate workspaces. Doctests aren't covered by
      # nextest, so they get a separate `cargo test --doc` pass.
      - name: cargo nextest run
        run: cargo nextest run --workspace --no-fail-fast

      - name: cargo test (doctests)
        run: cargo test --workspace --doc

      # xvfb-based smoke test removed — buffr now refuses non-Wayland sessions
      # on Linux (X11 dropped). Resurrecting requires a headless Wayland
      # compositor (weston-headless, sway-headless, cage) which is more CI
      # setup than the smoke is worth. Workspace build + 848 unit tests
      # already validate startup paths.

  linux-osr:
    name: linux build + lint (osr feature)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CEF_PATH: ${{ github.workspace }}/vendor/cef/linux64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: install CEF runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libxshmfence1 \
            libdrm2 libgbm1 libpango-1.0-0 libasound2-dev \
            libx11-xcb1 libxcb-dri3-0 libcups2 libxss1 libxtst6 \
            libgl1 libegl1 libgles2 \
            libglib2.0-dev

      - name: install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: false
      - run: rustup update --no-self-update stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-build-osr

      - name: cache CEF binary distribution
        uses: actions/cache@v5
        with:
          path: vendor/cef
          key: cef-linux64-${{ hashFiles('xtask/src/main.rs') }}

      - name: fetch CEF
        run: cargo xtask fetch-cef

      # No smoke test for the osr job — `BrowserHost::new_osr` and
      # `OsrHost::new` are scaffolded with `unimplemented!()` until
      # Phase 3 lands. We only verify the feature-gated code compiles
      # and is clippy-clean.
      - name: cargo build (osr)
        run: cargo build --workspace --features osr

      - name: cargo clippy (osr)
        run:
          cargo clippy --workspace --all-targets --features osr -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: bnjbvr/cargo-machete@main

  bundle-macos-cross:
    # Cross-bundle the macOS .app on a Linux runner. Catches
    # `xtask bundle-macos` regressions per-commit without paying for a real
    # macOS runner. The resulting bundle is filesystem-correct only —
    # the binaries inside are Linux ELFs and won't run on Darwin. Real
    # macOS smoke runs in `macos-package` against the signed DMG.
    #
    # Runs on every push/tag/workflow_dispatch in parallel with `linux`.
    # PR-triggered runs are excluded by the if: gate below. The job
    # builds independent code on a Linux runner, so gating it behind
    # `needs: [linux]` only adds wait time — drop the gate and fan out
    # from the start. If the workspace doesn't compile the bundle job
    # surfaces its own failure.
    name: macOS bundle (cross)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CEF_PATH: ${{ github.workspace }}/vendor/cef/linux64
      # Stub framework dir lets bundle-macos skip the macOS-only CEF
      # tarball and finish assembly using whatever bytes happen to be
      # in the directory we hand it. The contents don't matter — only
      # the bundle script's directory layout does.
      BUFFR_BUNDLE_FRAMEWORK_DIR: ${{ github.workspace }}/.ci/stub-framework
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: install CEF runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libxshmfence1 \
            libdrm2 libgbm1 libpango-1.0-0 libasound2-dev \
            libx11-xcb1 libxcb-dri3-0 libcups2 libxss1 libxtst6 \
            libgl1 libegl1 libgles2 \
            libglib2.0-dev \
            libxml2-utils

      - name: install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-build

      - name: cache CEF binary distribution
        uses: actions/cache@v5
        with:
          path: vendor/cef
          key: cef-linux64-${{ hashFiles('xtask/src/main.rs') }}

      - name: fetch CEF
        run: cargo xtask fetch-cef

      - name: stage stub macOS framework
        run: |
          mkdir -p "$BUFFR_BUNDLE_FRAMEWORK_DIR/Versions/A/Resources"
          echo stub > "$BUFFR_BUNDLE_FRAMEWORK_DIR/Versions/A/Chromium Embedded Framework"

      - name: cargo xtask bundle-macos
        run: cargo xtask bundle-macos

      - name: validate bundle layout
        run: |
          set -e
          test -f target/debug/Buffr.app/Contents/Info.plist
          test -f target/debug/Buffr.app/Contents/PkgInfo
          test -f target/debug/Buffr.app/Contents/MacOS/buffr-app
          test -d "target/debug/Buffr.app/Contents/Frameworks/Chromium Embedded Framework.framework"
          test -f "target/debug/Buffr.app/Contents/Frameworks/Buffr Helper.app/Contents/Info.plist"
          test -f "target/debug/Buffr.app/Contents/Frameworks/Buffr Helper.app/Contents/MacOS/Buffr Helper"
          xmllint --noout target/debug/Buffr.app/Contents/Info.plist
          xmllint --noout "target/debug/Buffr.app/Contents/Frameworks/Buffr Helper.app/Contents/Info.plist"

  linux-package:
    # Cross-build the .deb / .rpm / AUR PKGBUILD on a Linux runner. No
    # signing in this round — the release pipeline takes that over.
    # The job verifies the bundle scripts produce installable artifacts
    # and that `dpkg-deb -I` / `rpm -qpi` parse the resulting metadata.
    name: linux package (${{ matrix.platform }})
    needs: [linux]
    # Skipped on PRs only — runs on every main push + tag + manual
    # dispatch so packaging-code bugs surface BEFORE a release is cut.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux64
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linuxarm64
            deb_arch: arm64
            rpm_arch: aarch64
    env:
      CEF_PATH: ${{ github.workspace }}/vendor/cef/${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: install CEF runtime + packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libxshmfence1 \
            libdrm2 libgbm1 libpango-1.0-0 libasound2-dev \
            libx11-xcb1 libxcb-dri3-0 libcups2 libxss1 libxtst6 \
            libgl1 libegl1 libgles2 \
            dpkg dpkg-dev fakeroot file \
            rpm

      - name: install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-package-${{ matrix.platform }}

      - name: cache CEF binary distribution
        uses: actions/cache@v5
        with:
          path: vendor/cef
          key: cef-${{ matrix.platform }}-${{ hashFiles('xtask/src/main.rs') }}

      - name: fetch CEF
        run: cargo xtask fetch-cef --target ${{ matrix.platform }}

      - name: cargo xtask package-linux (release)
        run: cargo xtask package-linux --release --variant all

      - name: list artifacts
        run: ls -la target/dist/linux/

      - name: validate .deb metadata
        run: |
          set -e
          shopt -s nullglob
          debs=(target/dist/linux/buffr-*-${{ matrix.deb_arch }}.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::no .deb produced"
            exit 1
          fi
          dpkg-deb -I "${debs[0]}"
          dpkg-deb -c "${debs[0]}" | head -30
          echo "deb OK: ${debs[0]}"

      - name: validate .rpm metadata
        run: |
          set -e
          shopt -s nullglob
          rpms=(target/dist/linux/buffr-*-${{ matrix.rpm_arch }}.rpm)
          if [ ${#rpms[@]} -eq 0 ]; then
            echo "::error::no .rpm produced"
            exit 1
          fi
          rpm -qpi "${rpms[0]}"
          rpm -qpl "${rpms[0]}" | head -30
          echo "rpm OK: ${rpms[0]}"

      - name: validate tarball
        run: |
          set -e
          shopt -s nullglob
          tarballs=(target/dist/linux/buffr-*-${{ matrix.rpm_arch }}.tar.gz)
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "::error::no tarball produced"
            exit 1
          fi
          tar tzf "${tarballs[0]}" | head -10
          tar tzf "${tarballs[0]}" | grep -q '/buffr$'
          tar tzf "${tarballs[0]}" | grep -q '/buffr-app$'
          tar tzf "${tarballs[0]}" | grep -q '/libcef.so$'
          echo "tarball OK: ${tarballs[0]}"

      - name: smoke test extracted tarball
        # Catch link/load regressions on real binaries. --version/--help
        # exit inside clap before CEF init, so no display is needed.
        # buffr-app DT_NEEDEDs libcef.so → LD_LIBRARY_PATH points at the
        # extracted dir.
        run: |
          set -e
          shopt -s nullglob
          tarballs=(target/dist/linux/buffr-*-${{ matrix.rpm_arch }}.tar.gz)
          smoke_dir=$(mktemp -d)
          tar xzf "${tarballs[0]}" -C "$smoke_dir"
          bin_dir=$(dirname "$(find "$smoke_dir" -maxdepth 3 -type f -name buffr | head -1)")
          echo "smoke dir: $bin_dir"
          "$bin_dir/buffr" --version
          "$bin_dir/buffr" --help > /dev/null
          LD_LIBRARY_PATH="$bin_dir" "$bin_dir/buffr-app" --version
          LD_LIBRARY_PATH="$bin_dir" "$bin_dir/buffr-app" --help > /dev/null
          # buffr-helper has no clap. Bare invocation calls load_cef_library
          # then execute_subprocess; with no `--type=` arg cef returns -1
          # which Rust's process::exit converts to 255 on unix. Anything
          # else (1 = framework load failed, 139 = segfault) is a regression.
          set +e
          LD_LIBRARY_PATH="$bin_dir" "$bin_dir/buffr-helper"
          helper_rc=$?
          set -e
          if [ "$helper_rc" -ne 255 ]; then
            echo "::error::buffr-helper exited $helper_rc, expected 255 (no-type path)"
            exit 1
          fi
          echo "linux smoke OK"

      - name: validate PKGBUILD
        run: |
          set -e
          test -f pkg/aur/PKGBUILD
          grep -q '^pkgname=buffr$' pkg/aur/PKGBUILD
          grep -q '^pkgver=' pkg/aur/PKGBUILD
          grep -q "sha256sums=('SKIP')" pkg/aur/PKGBUILD
          echo "PKGBUILD OK"

      - name: compute sha256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd target/dist/linux
          for f in buffr-*.deb buffr-*.rpm buffr-*.tar.gz; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
            echo "sha256: $(cat "$f.sha256")"
          done

      - name: upload linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: buffr-linux-${{ matrix.platform }}
          path: |
            target/dist/linux/buffr-*.deb
            target/dist/linux/buffr-*.deb.sha256
            target/dist/linux/buffr-*.rpm
            target/dist/linux/buffr-*.rpm.sha256
            target/dist/linux/buffr-*.tar.gz
            target/dist/linux/buffr-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  macos-package:
    # Build the macOS .app + .dmg on a real macOS runner. Unsigned this
    # round; signing + notarization land in the eventual release workflow.
    # Apple Silicon only — see pkg/homebrew/buffr.rb.in for why Intel Mac
    # was dropped.
    name: macOS package (macosarm64)
    needs: [linux]
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-build-macosarm64

      - name: cache CEF binary distribution
        uses: actions/cache@v5
        with:
          path: vendor/cef
          key: cef-macosarm64-${{ hashFiles('xtask/src/main.rs') }}

      - name: fetch CEF (macosarm64)
        run: cargo xtask fetch-cef --target macosarm64

      - name: cargo xtask bundle-macos
        run: cargo xtask bundle-macos --release

      - name: cargo xtask package-macos-dmg
        run: cargo xtask package-macos-dmg --release

      - name: list artifacts
        run: ls -la target/dist/macos/

      - name: validate dmg exists
        run: |
          set -e
          shopt -s nullglob
          dmgs=(target/dist/macos/buffr-*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::no DMG produced"
            exit 1
          fi
          echo "DMG OK: ${dmgs[0]}"

      - name: smoke test mounted DMG
        # Mount the just-built DMG and invoke both bundled binaries with
        # --version / --help. Clap derive exits before CEF init, so no
        # display server / signed entitlements are required. Catches dyld
        # load failures (framework rpath rot, missing Helper, etc.).
        run: |
          set -e
          shopt -s nullglob
          dmgs=(target/dist/macos/buffr-*.dmg)
          mount=/Volumes/BuffrSmoke
          hdiutil attach "${dmgs[0]}" -mountpoint "$mount" -nobrowse -readonly
          trap 'hdiutil detach "$mount" -force >/dev/null 2>&1 || true' EXIT
          app=$(ls -d "$mount"/Buffr.app | head -1)
          test -n "$app" || { echo "::error::Buffr.app not in DMG"; exit 1; }
          "$app/Contents/MacOS/buffr" --version
          "$app/Contents/MacOS/buffr" --help > /dev/null
          "$app/Contents/MacOS/buffr-app" --version
          "$app/Contents/MacOS/buffr-app" --help > /dev/null
          # buffr-helper has no clap. Bare invocation runs the CEF subprocess
          # path; without `--type=` cef returns -1 → Rust exit 255. Anything
          # else means framework rpath rot, missing Mach-O, signing strip, etc.
          # Catch-all helper bundle is `Buffr Helper.app` (no suffix) and the
          # Mach-O inside is "Buffr Helper" (with space) per Apple's distinct-
          # executable rule.
          helper_exec="$app/Contents/Frameworks/Buffr Helper.app/Contents/MacOS/Buffr Helper"
          test -x "$helper_exec" || { echo "::error::Buffr Helper Mach-O missing: $helper_exec"; exit 1; }
          set +e
          "$helper_exec"
          helper_rc=$?
          set -e
          if [ "$helper_rc" -ne 255 ]; then
            echo "::error::Buffr Helper exited $helper_rc, expected 255 (no-type path)"
            exit 1
          fi
          echo "macos smoke OK"

      - name: compute sha256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd target/dist/macos
          for f in buffr-*.dmg; do
            [ -e "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
            echo "sha256: $(cat "$f.sha256")"
          done

      - name: upload dmg
        uses: actions/upload-artifact@v7
        with:
          name: buffr-macos-dmg-macosarm64
          path: |
            target/dist/macos/buffr-*.dmg
            target/dist/macos/buffr-*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  windows-package:
    # Build the Windows MSI on a real Windows runner. WiX 3 toolset
    # ships preinstalled on `windows-latest`; we still install
    # explicitly via choco to lock the version. Unsigned this round;
    # Authenticode signing lives in the release pipeline.
    name: Windows package (${{ matrix.platform }})
    needs: [linux]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows64
            rust_target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            platform: windowsarm64
            rust_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.rust_target }}
          cache: false
      - run: rustup update --no-self-update stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-build-${{ matrix.platform }}

      - name: install WiX 3 toolset
        run: choco install -y wixtoolset
        shell: powershell

      - name: add WiX to PATH
        # WiX 3 installs candle.exe + light.exe under
        # C:\Program Files (x86)\WiX Toolset v3.x\bin\.
        run:
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File
          -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: cache CEF binary distribution
        uses: actions/cache@v5
        with:
          path: vendor/cef
          key: cef-${{ matrix.platform }}-${{ hashFiles('xtask/src/main.rs') }}

      - name: fetch CEF (${{ matrix.platform }})
        run: cargo xtask fetch-cef --target ${{ matrix.platform }}

      - name: cargo build (release)
        run: cargo build --release -p buffr -p buffr-app -p buffr-helper

      - name: cargo xtask package-windows-msi
        run: cargo xtask package-windows-msi --release

      - name: list artifacts
        run: dir target\dist\windows\
        shell: cmd

      - name: validate msi exists
        run: |
          $msis = Get-ChildItem target\dist\windows\buffr-*.msi -ErrorAction SilentlyContinue
          if ($msis.Count -eq 0) {
            Write-Error "no MSI produced"
            exit 1
          }
          Write-Host "MSI OK: $($msis[0].FullName)"
        shell: powershell

      - name: package zip from staged payload
        # Reuse the payload-bin + payload-cef trees staged by
        # package-windows-msi. Zip filename mirrors the MSI so the scoop
        # manifest + sha256 sidecar pair line up: buffr-X.Y.Z-{x64|arm64}.zip.
        shell: pwsh
        run: |
          $msi = Get-ChildItem target\dist\windows\buffr-*.msi | Select-Object -First 1
          if ($null -eq $msi) {
            Write-Error "no MSI found to derive zip name from"
            exit 1
          }
          $zipName = $msi.Name -replace '\.msi$', '.zip'
          $zipPath = Join-Path target\dist\windows $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath }
          $bin = "target\dist\windows\payload-bin\*"
          $cef = "target\dist\windows\payload-cef\*"
          Compress-Archive -Path $bin, $cef -DestinationPath $zipPath -CompressionLevel Optimal
          Write-Host "zip OK: $zipPath"

      - name: smoke test extracted zip
        # Expand the zip the scoop manifest serves and run both supervisors
        # with --version / --help. Clap derive exits before CEF init, so
        # no display is needed. Catches PE link / DLL-search-path / missing
        # buffr-app.exe regressions on the actual user-installed payload.
        shell: pwsh
        run: |
          $zip = Get-ChildItem target\dist\windows\buffr-*.zip | Select-Object -First 1
          if ($null -eq $zip) { Write-Error "no zip to smoke-test"; exit 1 }
          $smokeDir = Join-Path $env:RUNNER_TEMP "buffr-smoke"
          if (Test-Path $smokeDir) { Remove-Item -Recurse -Force $smokeDir }
          Expand-Archive -Path $zip.FullName -DestinationPath $smokeDir
          & "$smokeDir\buffr.exe" --version
          if ($LASTEXITCODE -ne 0) { Write-Error "buffr --version failed ($LASTEXITCODE)"; exit 1 }
          & "$smokeDir\buffr.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "buffr --help failed ($LASTEXITCODE)"; exit 1 }
          & "$smokeDir\buffr-app.exe" --version
          if ($LASTEXITCODE -ne 0) { Write-Error "buffr-app --version failed ($LASTEXITCODE)"; exit 1 }
          & "$smokeDir\buffr-app.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "buffr-app --help failed ($LASTEXITCODE)"; exit 1 }
          # buffr-helper has no clap. Bare invocation runs the CEF subprocess
          # path; without `--type=` cef returns -1 → Rust exit -1 (0xFFFFFFFF).
          # PowerShell surfaces it as -1. Catches libcef.dll search-path /
          # PE link regressions on the actual user-installed payload.
          & "$smokeDir\buffr-helper.exe"
          if ($LASTEXITCODE -ne -1) {
            Write-Error "buffr-helper exited $LASTEXITCODE, expected -1 (no-type path)"
            exit 1
          }
          # Clear $LASTEXITCODE so the GH Actions pwsh wrapper doesn't
          # propagate helper's -1 as the step's overall exit code.
          $global:LASTEXITCODE = 0
          Write-Host "windows smoke OK"

      - name: compute sha256 checksums
        shell: pwsh
        run: |
          Get-ChildItem target\dist\windows\buffr-*.msi, target\dist\windows\buffr-*.zip | ForEach-Object {
            $f = $_.FullName
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            $name = $_.Name
            "$hash  $name" | Out-File -Encoding ASCII "$f.sha256"
            Write-Host "sha256: $hash  $name"
          }

      - name: upload msi + zip
        uses: actions/upload-artifact@v7
        with:
          name: buffr-windows-msi-${{ matrix.platform }}
          path: |
            target/dist/windows/buffr-*.msi
            target/dist/windows/buffr-*.msi.sha256
            target/dist/windows/buffr-*.zip
            target/dist/windows/buffr-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  flatpak:
    # Flatpak bundles are built from the tarball artifacts produced by
    # linux-package. Uploaded here so publish-github-release can download
    # and attach the .flatpak to the GH release without rebuilding.
    name: Flatpak bundle (${{ matrix.arch }})
    needs: [linux-package]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            tar_arch: x86_64
            linux_platform: linux64
          - runner: ubuntu-24.04-arm
            arch: arm64
            tar_arch: aarch64
            linux_platform: linuxarm64
    steps:
      - uses: actions/checkout@v6

      - name: download linux tarball artifact
        uses: actions/download-artifact@v8
        with:
          name: buffr-linux-${{ matrix.linux_platform }}
          path: flatpak/

      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder

      # GNOME Platform + SDK is ~2-3GB per arch and dominates cold-cache
      # Flatpak build time. Cache the user-scope flatpak directory; on
      # hit, `flatpak install` is a near-instant no-op. Key includes the
      # runtime version so a bump to //48 invalidates cleanly.
      - name: Cache flatpak GNOME runtime
        uses: actions/cache@v5
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-gnome47-${{ matrix.arch }}-v1
          restore-keys: |
            flatpak-runtime-gnome47-${{ matrix.arch }}-

      - name: Add flathub remote + install runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub \
            org.gnome.Platform//47 org.gnome.Sdk//47

      # flatpak-builder's per-module cache lives at .flatpak-builder/
      # next to the manifest. Survives across runs and lets unchanged
      # modules skip re-build. Keyed on manifest hash with a loose
      # restore-key so a manifest tweak still warm-starts from the
      # previous run's cache.
      - name: Cache flatpak-builder build cache
        uses: actions/cache@v5
        with:
          path: flatpak/.flatpak-builder
          key:
            flatpak-builder-${{ matrix.arch }}-${{
            hashFiles('flatpak/sh.kryptic.buffr.yml') }}
          restore-keys: |
            flatpak-builder-${{ matrix.arch }}-

      - name: Stage tarball payload
        run: |
          set -euo pipefail
          cd flatpak
          # Extract straight into `payload/` so the manifest's source
          # `path: payload` resolves. `--strip-components=1` drops the
          # tarball's top-level `buffr-<ver>-<arch>/` wrapper. Avoids
          # the `mv buffr-*-*` glob, which also matched the .tar.gz
          # itself and produced a "target 'payload': No such file" mv
          # error when given two sources.
          mkdir payload
          tar xzf buffr-*-${{ matrix.tar_arch }}.tar.gz -C payload --strip-components=1

      - name: Stage icon
        run: |
          # Manifest expects sh.kryptic.buffr.png next to it; canonical
          # icon lives at pkg/buffr.png. flatpak-builder rejects sources
          # outside the manifest dir, so copy it in.
          cp pkg/buffr.png flatpak/sh.kryptic.buffr.png

      - name: Stage desktop entry
        run: |
          # The unified .desktop source is `pkg/buffr.desktop`. Flatpak
          # AppStream rules require the .desktop filename + AppStream id
          # to match (`sh.kryptic.buffr`), and the icon name inside the
          # flatpak sandbox is the prefixed form. Rename + rewrite Icon=
          # in one step here so the canonical file stays single-source.
          sed 's|^Icon=buffr$|Icon=sh.kryptic.buffr|' \
            pkg/buffr.desktop > flatpak/sh.kryptic.buffr.desktop

      - name: Resolve version from tarball filename
        id: ver
        run: |
          set -euo pipefail
          # Pull version out of the artifact filename: buffr-X.Y.Z-<arch>.tar.gz
          f=$(ls flatpak/buffr-*-${{ matrix.tar_arch }}.tar.gz | head -1)
          base=$(basename "$f" "-${{ matrix.tar_arch }}.tar.gz")
          VERSION="${base#buffr-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build flatpak bundle
        run: |
          set -euo pipefail
          cd flatpak
          flatpak-builder --user --force-clean --repo=repo build sh.kryptic.buffr.yml
          flatpak build-bundle repo \
            "buffr-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.flatpak" sh.kryptic.buffr

      - name: Compute sha256 checksum
        run: |
          cd flatpak
          for f in buffr-*.flatpak; do
            sha256sum "$f" > "$f.sha256"
            echo "sha256: $(cat "$f.sha256")"
          done

      - name: upload flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: buffr-flatpak-${{ matrix.arch }}
          path: |
            flatpak/buffr-*.flatpak
            flatpak/buffr-*.flatpak.sha256
          if-no-files-found: error
          retention-days: 14

  snap:
    # Snap bundles are built from the tarball artifacts produced by
    # linux-package. Uploaded here so publish-github-release can download
    # and attach without rebuilding.
    name: Snap bundle (${{ matrix.arch }})
    needs: [linux-package]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            tar_arch: x86_64
            linux_platform: linux64
          - runner: ubuntu-24.04-arm
            arch: arm64
            tar_arch: aarch64
            linux_platform: linuxarm64
    steps:
      - uses: actions/checkout@v6

      - name: download linux tarball artifact
        uses: actions/download-artifact@v8
        with:
          name: buffr-linux-${{ matrix.linux_platform }}
          path: snap/

      - name: Stage tarball payload
        run: |
          set -euo pipefail
          # snapcraft resolves `source: payload` relative to the
          # project root (the dir containing snap/snapcraft.yaml's
          # parent), not the `snap/` dir, so stage at repo root.
          mkdir payload
          tar xzf snap/buffr-*-${{ matrix.tar_arch }}.tar.gz -C payload --strip-components=1

      - name: Resolve version from tarball filename
        id: ver
        run: |
          set -euo pipefail
          f=$(ls snap/buffr-*-${{ matrix.tar_arch }}.tar.gz | head -1)
          base=$(basename "$f" "-${{ matrix.tar_arch }}.tar.gz")
          VERSION="${base#buffr-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pin snap version
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          # snapcraft.yaml ships `version: "0.1.0"` as a placeholder so
          # local builds work; rewrite to the live tag before snapcraft
          # consumes it.
          sed -i "s/^version: .*/version: \"${VERSION}\"/" snap/snapcraft.yaml

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: .

      - name: Rename snap to versioned filename
        run: |
          set -euo pipefail
          mv "${{ steps.snapcraft.outputs.snap }}" \
             "buffr-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.snap"

      - name: Compute sha256 checksum
        run: |
          for f in buffr-*.snap; do
            sha256sum "$f" > "$f.sha256"
            echo "sha256: $(cat "$f.sha256")"
          done

      - name: upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: buffr-snap-${{ matrix.arch }}
          path: |
            buffr-*.snap
            buffr-*.snap.sha256
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    name: Publish GitHub release
    needs:
      - bundle-macos-cross
      - linux-package
      - macos-package
      - windows-package
      - flatpak
      - snap
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$CARGO_VER" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace.package version v$CARGO_VER"
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'buffr-*'
          merge-multiple: true
          path: release-artifacts/

      - name: Flatten artifact tree
        # actions/download-artifact with merge-multiple already merges files
        # into the target dir, but may still nest by artifact name depending
        # on version. Flatten unconditionally into dist/ for simple globs.
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-artifacts/ -type f | while read -r f; do
            cp "$f" dist/
          done
          ls -la dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/buffr-*.deb
            dist/buffr-*.deb.sha256
            dist/buffr-*.rpm
            dist/buffr-*.rpm.sha256
            dist/buffr-*.tar.gz
            dist/buffr-*.tar.gz.sha256
            dist/buffr-*.dmg
            dist/buffr-*.dmg.sha256
            dist/buffr-*.msi
            dist/buffr-*.msi.sha256
            dist/buffr-*.zip
            dist/buffr-*.zip.sha256
            dist/buffr-*.flatpak
            dist/buffr-*.flatpak.sha256
            dist/buffr-*.snap
            dist/buffr-*.snap.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aur-bin:
    # AUR auto-publish for `buffr-bin`. Pulls the just-uploaded tarball
    # checksums off the release, renders pkg/aur/PKGBUILD-bin.in,
    # generates .SRCINFO, and pushes to the AUR repo over SSH. Lives here
    # (not a separate workflow) because GITHUB_TOKEN-created releases don't
    # fire downstream `on: release` triggers; running as a
    # `needs: [publish-github-release]` job sidesteps the cascade entirely.
    #
    # Required org/repo secret:
    #   AUR_SSH_KEY  — ed25519 private key whose public half is registered
    #                  on the AUR account that owns the `buffr-bin` package.
    name: Publish buffr-bin to AUR
    needs: [publish-github-release]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build deps
        run: |
          set -euo pipefail
          # base-devel pulls in makepkg + fakeroot. openssh + git for
          # the AUR push. curl fetches the sha256 sidecars off the
          # release without needing the GitHub CLI.
          pacman -Sy --noconfirm --needed base-devel git openssh curl

      - uses: actions/checkout@v6

      - name: Resolve version
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG (pkgver=$VERSION)"

      - name: Fetch tarball sha256 sidecars
        id: sha
        run: |
          set -euo pipefail
          V="${{ steps.tag.outputs.version }}"
          BASE="https://github.com/kryptic-sh/buffr/releases/download/v${V}"
          # publish-github-release uploaded both arches before this job
          # ran (we `needs: [publish-github-release]`), so the sidecars
          # are guaranteed to exist.
          for arch in x86_64 aarch64; do
            curl -fsSL "$BASE/buffr-${V}-${arch}.tar.gz.sha256" -o "sha.${arch}"
          done
          # sidecar format: `<hash>  <filename>` — keep first column.
          echo "x86_64=$(awk '{print $1}' sha.x86_64)" >> "$GITHUB_OUTPUT"
          echo "aarch64=$(awk '{print $1}' sha.aarch64)" >> "$GITHUB_OUTPUT"

      - name: Render PKGBUILD
        run: |
          set -euo pipefail
          mkdir -p out
          sed \
            -e "s/{VERSION}/${{ steps.tag.outputs.version }}/g" \
            -e "s/{SHA256_X86_64}/${{ steps.sha.outputs.x86_64 }}/g" \
            -e "s/{SHA256_AARCH64}/${{ steps.sha.outputs.aarch64 }}/g" \
            pkg/aur/PKGBUILD-bin.in > out/PKGBUILD
          echo "--- rendered PKGBUILD ---"
          cat out/PKGBUILD

      - name: Generate .SRCINFO
        run: |
          set -euo pipefail
          # makepkg refuses to run as root. The archlinux:latest image's
          # `nobody` user has an expired password (`su: User account has
          # expired`), so we provision a fresh build user instead.
          useradd -m builder
          chown -R builder:builder out
          # `su` parses options BEFORE the username; anything after gets
          # passed to the shell. The previous form `su builder -s /bin/bash
          # -c '...'` made bash read commands from stdin (`-s`) and exit
          # silently with code 0 — makepkg never ran. Put `-s` first.
          su -s /bin/bash builder -c 'cd out && makepkg --printsrcinfo > .SRCINFO'
          echo "--- .SRCINFO ---"
          cat out/.SRCINFO

      - name: Configure SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

      - name: Push to AUR
        # `GIT_SSH_COMMAND` injects ssh options inline so we don't depend on
        # `~/.ssh/config` parsing (heredoc indent broke it previously) or on
        # `ssh-keyscan` output. `accept-new` writes the AUR host key to
        # known_hosts on first connect; subsequent connects strict-verify.
        env:
          GIT_SSH_COMMAND:
            'ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o
            StrictHostKeyChecking=accept-new -o
            UserKnownHostsFile=~/.ssh/known_hosts'
        run: |
          set -euo pipefail
          git config --global user.name  "buffr-ci"
          git config --global user.email "ci@kryptic.sh"
          git clone ssh://aur@aur.archlinux.org/buffr-bin.git aur-repo
          # PKGBUILD + .SRCINFO are required; LICENSE (0BSD on the
          # PKGBUILD itself) and .gitignore (exclude-all + force-add)
          # are wiki recommendations.
          cp out/PKGBUILD out/.SRCINFO aur-repo/
          cp pkg/aur/LICENSE pkg/aur/.gitignore aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO LICENSE .gitignore
          if git diff --cached --quiet; then
            echo "no changes vs current AUR head; nothing to push"
            exit 0
          fi
          git commit -m "buffr-bin ${{ steps.tag.outputs.version }}-1"
          git push origin master

  brew-tap:
    # Homebrew Cask auto-publish to kryptic-sh/homebrew-tap. Fetches the
    # arm64 dmg sha256 sidecar off the release, renders pkg/homebrew/buffr.rb.in,
    # and pushes to the tap repo over SSH. Runs after `publish-github-release`
    # so the dmg + sidecar are guaranteed to be uploaded before we fetch.
    #
    # Required org/repo secret (SELECTED-scope — must be granted to this repo):
    #   BREW_SSH_KEY  — ed25519 private key whose public half is a deploy key
    #                   with write access on kryptic-sh/homebrew-tap.
    name: Publish buffr cask to homebrew-tap
    needs: [publish-github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch dmg sha256 sidecar
        id: sha
        run: |
          set -euo pipefail
          V="${{ steps.tag.outputs.version }}"
          BASE="https://github.com/kryptic-sh/buffr/releases/download/v${V}"
          curl -fsSL "$BASE/buffr-${V}-arm64.dmg.sha256" -o sha.aarch64-darwin
          echo "aarch64=$(awk '{print $1}' sha.aarch64-darwin)" >> "$GITHUB_OUTPUT"

      - name: Render cask
        run: |
          set -euo pipefail
          mkdir -p out
          sed \
            -e "s|{VERSION}|${{ steps.tag.outputs.version }}|g" \
            -e "s|{SHA256_AARCH64_DARWIN}|${{ steps.sha.outputs.aarch64 }}|g" \
            pkg/homebrew/buffr.rb.in > out/buffr.rb
          echo "--- rendered cask ---"
          cat out/buffr.rb

      - name: Configure SSH for homebrew-tap
        env:
          BREW_SSH_KEY: ${{ secrets.BREW_SSH_KEY }}
        run: |
          set -euo pipefail
          install -dm700 ~/.ssh
          printf '%s\n' "$BREW_SSH_KEY" > ~/.ssh/brew
          chmod 600 ~/.ssh/brew

      - name: Push cask to homebrew-tap
        env:
          GIT_SSH_COMMAND:
            'ssh -i ~/.ssh/brew -o IdentitiesOnly=yes -o
            StrictHostKeyChecking=accept-new -o
            UserKnownHostsFile=~/.ssh/known_hosts'
        run: |
          set -euo pipefail
          git config --global user.name  "buffr-ci"
          git config --global user.email "ci@kryptic.sh"
          git clone git@github.com:kryptic-sh/homebrew-tap.git tap
          mkdir -p tap/Casks
          cp out/buffr.rb tap/Casks/buffr.rb
          cd tap
          git add Casks/buffr.rb
          if git diff --cached --quiet; then
            echo "no changes vs current tap head; nothing to push"
            exit 0
          fi
          git commit -m "buffr ${{ steps.tag.outputs.version }}"
          git push origin HEAD:main

  scoop-bucket:
    # Scoop manifest auto-publish to kryptic-sh/scoop-bucket. Fetches the
    # Windows x64 + arm64 zip sha256 sidecars off the release, renders
    # pkg/scoop/buffr.json.in, and pushes to the bucket repo over SSH.
    # Runs after `publish-github-release` so the zips + sidecars are
    # guaranteed to be uploaded before we fetch.
    #
    # Required org/repo secret (SELECTED-scope — must be granted to this repo):
    #   SCOOP_SSH_KEY  — ed25519 private key whose public half is a deploy key
    #                    with write access on kryptic-sh/scoop-bucket.
    name: Publish buffr manifest to scoop-bucket
    needs: [publish-github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch zip sha256 sidecars
        id: sha
        run: |
          set -euo pipefail
          V="${{ steps.tag.outputs.version }}"
          BASE="https://github.com/kryptic-sh/buffr/releases/download/v${V}"
          curl -fsSL "$BASE/buffr-${V}-x64.zip.sha256"   -o sha.x64
          curl -fsSL "$BASE/buffr-${V}-arm64.zip.sha256" -o sha.arm64
          echo "x64=$(awk '{print $1}' sha.x64)"     >> "$GITHUB_OUTPUT"
          echo "arm64=$(awk '{print $1}' sha.arm64)" >> "$GITHUB_OUTPUT"

      - name: Render manifest
        run: |
          set -euo pipefail
          mkdir -p out
          sed \
            -e "s|{VERSION}|${{ steps.tag.outputs.version }}|g" \
            -e "s|{SHA256_X64}|${{ steps.sha.outputs.x64 }}|g" \
            -e "s|{SHA256_ARM64}|${{ steps.sha.outputs.arm64 }}|g" \
            pkg/scoop/buffr.json.in > out/buffr.json
          echo "--- rendered manifest ---"
          cat out/buffr.json

      - name: Configure SSH for scoop-bucket
        env:
          SCOOP_SSH_KEY: ${{ secrets.SCOOP_SSH_KEY }}
        run: |
          set -euo pipefail
          install -dm700 ~/.ssh
          printf '%s\n' "$SCOOP_SSH_KEY" > ~/.ssh/scoop
          chmod 600 ~/.ssh/scoop

      - name: Push manifest to scoop-bucket
        env:
          GIT_SSH_COMMAND:
            'ssh -i ~/.ssh/scoop -o IdentitiesOnly=yes -o
            StrictHostKeyChecking=accept-new -o
            UserKnownHostsFile=~/.ssh/known_hosts'
        run: |
          set -euo pipefail
          git config --global user.name  "buffr-ci"
          git config --global user.email "ci@kryptic.sh"
          git clone git@github.com:kryptic-sh/scoop-bucket.git bucket
          mkdir -p bucket/bucket
          cp out/buffr.json bucket/bucket/buffr.json
          cd bucket
          git add bucket/buffr.json
          if git diff --cached --quiet; then
            echo "no changes vs current bucket head; nothing to push"
            exit 0
          fi
          git commit -m "buffr ${{ steps.tag.outputs.version }}"
          git push origin HEAD:main
