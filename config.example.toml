# buffr configuration — copy to ~/.config/buffr/config.toml.
#
# The path is XDG-everywhere: the SAME ~/.config/buffr/config.toml on
# Linux, macOS, and Windows (resolution goes through
# `hjkl_config::config_path`, not `directories`/`ProjectDirs`).
# $XDG_CONFIG_HOME is honored on every platform. Debug builds read
# ~/.config/buffr-debug/config.toml so dev runs don't trample release
# state. Override per-run with `--config <PATH>`.
#
# Every key has a default; omitted entries fall back to the values
# shown below, which ARE the built-in defaults unless a comment says
# otherwise.

[general]
# Initial URL on first window when no session is restored.
homepage = "buffr://new"
# Single-character leader. Default is a single space (" "); vim's
# traditional "\\" also works. The loader validates this is exactly
# one Unicode scalar value at startup; multi-char strings are rejected
# with an error pointing at general.leader.
leader = " "
# Render per-tab favicons. When false the tab strip skips favicon
# rendering and the host suppresses the CEF favicon download.
# `--private` also forces this off for the run.
show_favicons = true

[startup]
# `restore_session = true` reopens the previous session's tabs on
# launch (default `false` — fresh launches start at `general.homepage`).
# A fresh tab (`o`/`O`/`:tabnew`) opens `new_tab_url` (default
# `about:blank`).
#
# Reopen the previous session's tabs on launch.
restore_session = false
# URL a fresh tab navigates to.
new_tab_url = "about:blank"

[search]
# Must match a key under [search.engines.<name>].
default_engine = "duckduckgo"

[search.engines.duckduckgo]
url = "https://duckduckgo.com/?q={query}"
# Optional shortcut keyword. `<prefix> <query>` in the omnibar routes to
# this engine instead of `default_engine` (e.g. `ddg vim folding`).
prefix = "ddg"

[search.engines.google]
url = "https://www.google.com/search?q={query}"
prefix = "g"

[theme]
# Every colour below must be a 7-character `#RRGGBB` string. An
# unparseable value is a hard config error (`--check-config` exits
# non-zero); it is no longer silently ignored.
#
# Base accent. Status line, omnibar caret, hint label background,
# active-tab indicator.
accent = "#7aa2f7"
# Cert-state secure indicator (lock dot, find counts).
cert_secure = "#66e08a"
# Cert-state insecure indicator.
cert_insecure = "#e05a5a"
# PRIVATE marker on the right-hand statusline cell.
private = "#ffc8c8"
# Page-load progress bar at the top of the statusline.
progress = "#66c2ff"
# Update-available indicator (`* upd`).
update = "#e0c85a"
# Phase 6 a11y: switch chrome to a high-contrast palette
# (white-on-black with a saturated yellow accent). Overrides every
# colour above. See `docs/accessibility.md` for the values.
high_contrast = false

[privacy]
# Opt-in **local-only** usage counters. When `true`, buffr accumulates
# anonymous integer counters (app_starts, tabs_opened, pages_loaded,
# searches_run, bookmarks_added, downloads_completed) and writes them
# to `<data>/usage-counters.json` for the user to inspect. No network
# endpoint exists; buffr never sends telemetry anywhere. Even on opt-in
# the counters stay local. See `docs/privacy.md`.
enable_telemetry = false
# Categories wiped on shutdown. Each entry is processed independently:
# one failure doesn't skip the rest. Successes log at INFO; failures
# at WARN. Order in the list does not matter.
#
# Valid entries:
#   "cookies"        — flush every cookie via CEF's global cookie
#                      manager.
#   "cache"          — delete <XDG_DATA_HOME>/buffr/Cache.
#   "history"        — wipe every row in history.sqlite.
#   "bookmarks"      — wipe every row in bookmarks.sqlite. Destructive;
#                      only honored when listed.
#   "downloads"      — wipe every row in downloads.sqlite (regardless
#                      of status).
#   "local_storage"  — delete <XDG_DATA_HOME>/buffr/Local Storage.
#
# Example: paranoid web-browsing — wipe cookies, cache, and local
# storage on exit; keep history + bookmarks.
#
# clear_on_exit = ["cookies", "cache", "local_storage"]
clear_on_exit = []
# URL schemes whose visits are never recorded in browsing history.
# The scheme component is matched case-insensitively. The default list
# covers internal browser pages (about:, cef:, chrome:) and
# privacy-sensitive local URLs (data:, file:). Extend to suppress
# additional schemes (e.g. add "javascript", "blob"); remove entries to
# record those schemes (unusual but supported).
skip_schemes = ["about", "cef", "chrome", "data", "file"]
# Permissions store lives at <data>/permissions.sqlite. Use the
# `--list-permissions` / `--clear-permissions` / `--forget-origin` CLI
# flags to inspect or reset the table without launching CEF. Adding
# `permissions` to `clear_on_exit` is reserved (Phase 5 follow-up); for
# now use `--clear-permissions` to wipe the table.

[downloads]
# Directory downloads land in. If unset (the default), buffr resolves
# at runtime in this order:
#   1. dirs::download_dir() (XDG_DOWNLOAD_DIR on Linux; ~/Downloads on
#      macOS; %USERPROFILE%\Downloads on Windows)
#   2. $HOME/Downloads as a last-resort fallback
#   3. the current working directory if even that is unavailable.
# default_dir = "/home/me/Downloads"
#
# Open the file via the platform's launcher (xdg-open / open / start)
# the moment a download finishes. Default false.
open_on_finish = false
# Show a save-as dialog for every download. When true, CEF's native OS
# Save-As dialog fires (BeforeDownloadCallback::cont show_dialog=1) and
# the notification strip is suppressed — the OS dialog is the feedback.
# Default false: files land in default_dir and the strip appears.
ask_each_time = false
# Show a chrome notification strip when a silent download (ask_each_time
# = false) starts or finishes. Strip auto-expires: 2 s for Started, 4 s
# for Completed/Failed. Set false to opt out entirely.
show_notifications = true

[hint]
# Ordered character list used to mint hint labels. Validated as
# non-empty, ASCII-only, no duplicates, ≥ 2 chars. Default mirrors
# Vimium's home-row + upper-row alphabet. For full keyboard reach use
# "abcdefghijklmnopqrstuvwxyz"; for strict home-row use "asdfjkl;".
alphabet = "asdfghjkl;weruio"

[crash_reporter]
# Opt-in local panic reporter. When `true`, buffr installs a Rust
# panic hook that writes JSON crash files under `<data>/crashes/`.
# Reports stay on disk for the user to inspect or mail; nothing is
# uploaded. CEF native-crash capture (crashpad/breakpad) is not yet
# configured — see `docs/privacy.md`.
enabled = false
# Cutoff for `--purge-crashes`. Reports older than this many days are
# removed. Default 30. Must be > 0 — `0` is rejected at load time
# (it would make `--purge-crashes` delete every report).
purge_after_days = 30

[updates]
# Phase 6 update channel. The ONLY network request buffr makes by
# default — one HTTP GET per `check_interval_hours` against the
# GitHub releases API, no PII. Set `enabled = false` to disable
# entirely; that path makes ZERO network calls. See
# `docs/privacy.md` and `docs/updates.md`.
enabled = true
# Minimum hours between live `--check-for-updates` queries. Reads
# inside the window come from the on-disk cache.
check_interval_hours = 24
# `owner/repo` slug. Forks override this.
github_repo = "kryptic-sh/buffr"

[accessibility]
# Phase 6 a11y: enable CEF's renderer accessibility tree by passing
# `--force-renderer-accessibility` through the App command-line hook.
# Platform screen readers (Orca/AT-SPI on Linux, VoiceOver on macOS,
# NVDA/JAWS on Windows) consume that tree. Default `false` because
# building the tree adds a non-trivial per-frame cost; users with an
# AT should turn it on. See `docs/accessibility.md`.
force_renderer_accessibility = false

[idle_inhibit]
# Prevent the screen locking / blanking while a video signal is active
# in the focused window. Backed by zwp_idle_inhibit_manager_v1
# (Wayland), org.freedesktop.ScreenSaver (X11 D-Bus),
# IOPMAssertionCreateWithName (macOS), and SetThreadExecutionState
# (Windows).
#
# Master switch. `true` (the default) allows the inhibitor to be
# acquired; `false` disables the feature entirely — no platform call
# is ever made.
enabled = true
# When true, audio-only activity (no video) also holds the inhibitor.
# Default false — music playback should not keep the screen on.
inhibit_audio_only = false
# When true (the default) the inhibitor is only held while the buffr
# window has OS focus. Set false to inhibit in the background (PiP).
require_focus = true

# ----------------------------------------------------------------------
# Engine routing
# ----------------------------------------------------------------------
#
# `default` is the engine id used for every URL that does not match a
# rule. `instances` registers the backends constructed at startup; when
# it is EMPTY (the default) a single `{ id = "cef", backend = "cef" }`
# instance is synthesised, so single-engine setups need nothing here.
# `rules` is an ordered list — first match wins; `match` is a glob
# tested case-insensitively against the URL host.
#
# Validation: `default` must be non-empty and must name a declared (or
# synthesised) instance, instance ids must be unique, and every rule's
# `engine` must resolve to an instance.
#
# `backend` accepts only "cef" — that is the only backend the browser
# can construct. (crates/buffr-webkit exists but is excluded from the
# workspace, Linux-only, and not built by CI.)
#
# `data_dir` is parsed and passed to the backend, but the CEF backend
# discards it: no per-engine RequestContext is created, because CEF's
# Alloy runtime collapses a child cache_path onto the global Default
# profile anyway (kryptic-sh/buffr#158). Every instance therefore shares
# one on-disk profile — CEF's root_cache_path, which is the XDG data dir
# (~/.local/share/buffr). Setting `data_dir` has no observable effect
# today; the key stays so configs survive the eventual isolation work.

[engines]
default = "cef"
# instances = []   # default: empty -> synthesised `cef` instance
# rules = []       # default: empty

# [[engines.instances]]
# id      = "cef"
# backend = "cef"
# data_dir = "/tmp/cef-b-cache"  # accepted; no effect today

# [[engines.rules]]
# match  = "*.figma.com"
# engine = "cef"

# ----------------------------------------------------------------------
# Keymap overrides
# ----------------------------------------------------------------------
#
# Each `[keymap.<mode>]` table maps a vim-notation key sequence to a
# PageAction. Values are strings using snake_case action names. Unit
# variants are bare names ("scroll_down"); count-bearing scrolls take
# a parenthesised count ("scroll_down(3)"); `find` takes a named
# `forward` boolean ("find(forward = true)"). Mode transitions use
# `enter_mode("normal" | "visual" | "command" | "hint")`.
#
# Bindings overlay on top of the built-in defaults — entries here
# override individual rows; everything not listed keeps its default.
#
# Every binding is validated at load time. An invalid action name or
# unparseable key sequence aborts startup with a line/column-tagged
# error.
#
# The block below is an EXAMPLE of overrides, not a copy of the
# defaults — several rows here deliberately differ from the shipped
# keymap (e.g. buffr's default `H`/`L` are tab prev/next and `o` opens
# a new tab to the right). The authoritative default table is
# `docs/keymap.md`, or run `buffr --audit-keymap`.

[keymap.normal]
"j" = "scroll_down"
"k" = "scroll_up"
"gg" = "scroll_top"
"G" = "scroll_bottom"
"<C-d>" = "scroll_half_page_down"
"<C-u>" = "scroll_half_page_up"
"H" = "history_back"
"L" = "history_forward"
"r" = "reload"
"<C-r>" = "reload_hard"
"o" = "open_omnibar"
":" = "open_command_line"
"f" = "enter_hint_mode"
"/" = "find(forward = true)"
"?" = "find(forward = false)"
"n" = "find_next"
"N" = "find_prev"
"y" = "yank_url"

[keymap.visual]
"y" = "yank_selection"
"<Esc>" = "enter_mode(\"normal\")"

[keymap.command]
"<Esc>" = "enter_mode(\"normal\")"

[keymap.hint]
"<Esc>" = "enter_mode(\"normal\")"
