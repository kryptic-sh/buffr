[package]
name = "buffr-engine"
description = "Engine-agnostic browser trait + neutral types for buffr."
version = "0.1.7"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kryptic-sh/buffr-engine"
homepage = "https://buffr.kryptic.sh"
authors = ["mxaddict <mxaddict@kryptic.sh>"]

[dependencies]
base64 = "0.22"
getrandom = "0.2"
# raw-window-handle 0.6 lets backends accept a host wl_surface for native
# subsurface compositing (Phase 3 of the WPE WebKit umbrella, #109). Type-
# only crate; no transitive runtime weight.
raw-window-handle = "0.6"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
buffr-modal = "0.1"
# Only pulls the `Capability` / `Decision` type surface. The SQLite store
# is gated behind buffr-permissions' `store` feature, which we don't
# enable — keeps rusqlite out of buffr-engine's transitive closure so
# standalone backend crates (buffr-servo) can resolve a different
# rusqlite major than the umbrella workspace.
buffr-permissions = { version = "0.1.3", default-features = false }
