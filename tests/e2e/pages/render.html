<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: sans-serif; background: #ffffff; }
  .banner { height: 90px; background: #cc3344; color: #fff; font-size: 28px;
            display: flex; align-items: center; padding-left: 16px; }
  .row { display: flex; height: 220px; }
  .a { flex: 1; background: #2266cc; color: #fff; }
  .b { flex: 1; background: #33aa55; color: #fff; }
  .c { flex: 1; background: #ddaa22; color: #222; }
  .box { display: flex; align-items: center; justify-content: center;
         font-size: 30px; }
  .text { padding: 16px; font-size: 18px; }
</style>
</head>
<body>
  <div class="banner">RENDER FIXTURE ONE</div>
  <div class="row">
    <div class="a box">BLUE A</div>
    <div class="b box">GREEN B</div>
    <div class="c box">YELLOW C</div>
  </div>
  <div class="text">Render e2e fixture: distinct color blocks for pixel checks.</div>
</body>
</html>
