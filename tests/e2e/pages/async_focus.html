<!doctype html>
<meta charset="utf-8">
<title>async focus</title>
<style>body{font:16px sans-serif;padding:20px}
 #target{width:300px;height:60px;border:1px solid #888;line-height:60px;text-align:center}
 input{display:block;width:300px;height:40px;font-size:16px;margin-top:12px}</style>
<h1>focus 600 ms after the click</h1>
<!-- Longer than the 500 ms insert-intent window in the apps layer. Real
     sites do this whenever focus waits on a fetch or a hydration tick. -->
<div id="target">click me</div>
<input id="late" type="text" placeholder="focused later">
<script>
document.getElementById('target').addEventListener('click', function () {
  setTimeout(function () { document.getElementById('late').focus(); }, 600);
});
</script>
