<!doctype html>
<meta charset="utf-8">
<title>already focused</title>
<script src="e2e.js"></script>
<style>body{font:16px sans-serif;padding:20px}
 input{display:block;width:300px;height:40px;font-size:16px;margin:12px 0}</style>
<script>
window.__e2eTrigger = function () {
  var el = document.getElementById('text');
  el.focus();
  // Second focus on the already-focused field fires no focusin at all.
  setTimeout(function () { el.focus(); }, 100);
};
</script>
<h1>click a field that already has focus</h1>
<!-- No focusin fires the second time. If Insert was left for any reason
     other than a blur, the re-click cannot recover it. -->
<input id="text" type="text" placeholder="focused twice" autofocus>
