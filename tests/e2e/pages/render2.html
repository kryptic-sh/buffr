<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
  .banner { height: 90px; background: #7744aa; color: #fff; font-size: 28px;
            display: flex; align-items: center; padding-left: 16px; }
  .row { display: flex; height: 220px; }
  .a { flex: 1; background: #cc6633; color: #fff; }
  .b { flex: 1; background: #3399cc; color: #fff; }
  .c { flex: 1; background: #99cc33; color: #222; }
  .box { display: flex; align-items: center; justify-content: center;
         font-size: 30px; }
  .text { padding: 16px; font-size: 18px; }
</style>
</head>
<body>
  <div class="banner">RENDER FIXTURE TWO</div>
  <div class="row">
    <div class="a box">ORANGE A</div>
    <div class="b box">TEAL B</div>
    <div class="c box">LIME C</div>
  </div>
  <div class="text">Second render fixture for multi-tab strip checks.</div>
</body>
</html>
