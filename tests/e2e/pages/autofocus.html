<!doctype html>
<meta charset="utf-8">
<title>autofocus</title>
<script src="e2e.js"></script>
<style>body{font:16px sans-serif;padding:20px}
 input{display:block;width:300px;height:40px;font-size:16px;margin:12px 0}
 #pad{height:60px}</style>
<h1>page autofocuses on load</h1>
<!-- No user gesture happened, so this must NOT put the browser in Insert. -->
<div id="pad"></div>
<input id="auto" type="text" placeholder="autofocused" autofocus>
<script>
window.addEventListener('load', function () {
  setTimeout(function () { document.getElementById('auto').focus(); }, 50);
});
</script>
