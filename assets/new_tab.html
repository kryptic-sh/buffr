<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <style>
    :root { color-scheme: dark light; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #1a1b26; color: #c0caf5;
    }
    main {
      max-width: 56rem; margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }
    header { text-align: center; margin-bottom: 3rem; }
    header p { font-size: 1rem; opacity: 0.6; margin: 0; }
    /* Splash wordmark. The buffr host pushes the current animation
       frame's HTML into `#buffr-splash` on every splash tick (~8 Hz)
       via execute_javascript; we just need the cell to exist and be
       styled. Plain art chars inherit the dim color; cursor/trail
       cells are wrapped in `<span class="hl">…</span>` and lit up
       with the accent. Initial textContent below shows frame 0 so
       the wordmark is visible before the first JS push lands. */
    /* Splash wordmark. Two `<pre>` layers stacked at the same position:
       the static art layer (dim) and a cursor overlay (accent) that the
       host overwrites with mostly-spaces + `█` at the active cells on
       every splash tick. Stacking avoids inline spans, which break
       monospace alignment when `█` and ASCII share glyphs from
       different fonts in the browser's fallback chain. */
    .splash-wrap { text-align: center; margin: 0 0 2.5rem; }
    .splash-stack {
      display: inline-block; position: relative;
      font-family: ui-monospace, monospace;
      line-height: 1; letter-spacing: 0;
    }
    .splash-stack > pre {
      margin: 0; padding: 0;
      font: inherit; line-height: inherit; letter-spacing: inherit;
    }
    .splash-art { color: rgba(192, 202, 245, 0.35); }
    #buffr-splash {
      position: absolute; inset: 0;
      color: #7dcfff; pointer-events: none;
    }
    section h2 {
      font-size: 0.85rem; text-transform: uppercase;
      letter-spacing: 0.1em; opacity: 0.55;
      margin: 0 0 0.75rem; font-weight: 600;
    }
    table {
      width: 100%; border-collapse: collapse;
      font-size: 0.9rem;
    }
    td {
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    td.k {
      width: 12rem; white-space: nowrap;
      font-family: ui-monospace, monospace;
    }
    td.a {
      opacity: 0.85;
      font-family: ui-monospace, monospace;
    }
    kbd {
      font-family: ui-monospace, monospace;
      background: rgba(255,255,255,0.08);
      padding: 0.15em 0.4em; border-radius: 4px;
      font-size: 0.85em;
    }
    .empty {
      opacity: 0.5; font-style: italic; padding: 1rem 0;
    }
  </style>
</head>
<body>
  <main>
    <div class="splash-wrap"><div class="splash-stack"><pre class="splash-art">██████  ██    ██ ███████ ███████ ██████
██   ██ ██    ██ ██      ██      ██   ██
██████  ██    ██ █████   █████   ██████
██   ██ ██    ██ ██      ██      ██   ██
██████   ██████  ██      ██      ██   ██</pre><pre id="buffr-splash"></pre></div></div>
    <header>
      <p>Press <kbd>e</kbd> to open the omnibar.</p>
    </header>
    <section>
      <h2>Keybindings</h2>
      <table>
        <tbody>
        <!--KEYBINDS-->
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
