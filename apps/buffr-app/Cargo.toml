[package]
name = "buffr-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Vim-inspired browser. Native, GPU-accelerated. Rust + CEF."
# Browser binary. `buffr` (supervisor) spawns this as its child process.
publish = false

[[bin]]
name = "buffr-app"
path = "src/main.rs"


[dependencies]
buffr-engine.workspace = true
buffr-cef.workspace = true
buffr-core.workspace = true
buffr-history.workspace = true
buffr-bookmarks.workspace = true
buffr-downloads.workspace = true
buffr-zoom.workspace = true
buffr-permissions = { workspace = true, features = ["store"] }
buffr-modal = { workspace = true, features = ["bridge"] }
buffr-ui.workspace = true
buffr-config.workspace = true
hjkl-splash.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
raw-window-handle.workspace = true
clap.workspace = true
tempfile.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
ctrlc = "3.5.2"
interprocess = "2"
sha2 = "0.11"
hex = "0.4"
globset = "0.4"
url.workspace = true
thiserror.workspace = true
# winit provides cross-platform windowing on all platforms. CEF runs in
# OSR mode and renders into a wgpu surface; no native window embedding
# is needed. buffr-modal's `bridge` adapter translates winit KeyEvents
# into the engine's KeyChord type.
#
# default-features=false + `rwh_06`: avoids pulling in the `wayland` /
# `x11` feature flags on macOS/Windows runners where pkg-config Wayland
# probes would fail. AppKit / Win32 backends are cfg-gated by target_os
# inside winit itself, so they stay active regardless.
# Linux gets the `wayland` feature added via the target block below.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
proptest = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux: add winit's Wayland backend. buffr requires a Wayland session on
# Linux (enforced at runtime); winit on Linux without `wayland` fails to
# compile. `wayland-dlopen` loads libwayland at runtime rather than link-
# time, keeping the binary runnable on minimal systems that have libwayland
# in a non-standard path.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "wayland",
    "wayland-dlopen",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
