[package]
name = "buffr-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Vim-inspired browser. Native, GPU-accelerated. Rust + CEF."
# Browser binary. `buffr` (supervisor) spawns this as its child process.
publish = false

[[bin]]
name = "buffr-app"
path = "src/main.rs"


[dependencies]
buffr-engine.workspace = true
buffr-cef.workspace = true
buffr-core.workspace = true
buffr-history.workspace = true
buffr-bookmarks.workspace = true
buffr-downloads.workspace = true
buffr-zoom.workspace = true
buffr-permissions = { workspace = true, features = ["store"] }
# buffr-modal feature is selected per target below: `wayr` on Linux,
# `winit` on macOS/Windows. Without features here so the platform-
# specific target.cfg blocks add them.
buffr-modal.workspace = true
buffr-ui.workspace = true
buffr-config.workspace = true
hjkl-splash.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
raw-window-handle.workspace = true
clap.workspace = true
tempfile.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
ctrlc = "3.5.2"
interprocess = "2"
sha2 = "0.11"
hex = "0.4"
globset = "0.4"
url.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux: wayr is the Wayland-native windowing toolkit. WPE WebKit
# subsurface embedding (planned engine path) requires direct Wayland
# dispatch ownership, which winit can't provide without rewriting its
# Wayland backend. On macOS/Windows where WPE isn't shippable anyway,
# the buffr-app build switches to winit (see below).
[target.'cfg(target_os = "linux")'.dependencies]
wayr = { version = "0.2.1", features = [
    "subsurface",
    "text-input",
    "cursor-shape",
    "fractional-scale",
    "xdg-activation",
] }
buffr-modal = { workspace = true, features = ["wayr"] }

# macOS / Windows: winit provides cross-platform windowing. CEF in OSR
# mode renders into a wgpu surface; the browser content doesn't need
# any platform-specific window embedding. buffr-modal's winit_adapter
# (parallel to wayr_adapter) translates winit KeyEvents into the
# engine's KeyChord type.
#
# winit with default-features=false + only `rwh_06`: drops the
# `wayland` / `x11` features that would force a pkg-config wayland
# probe on macOS/Windows runners. AppKit / Win32 backends are
# cfg-gated by target_os inside winit, not by Cargo features, so they
# stay active regardless. `rwh_06` adds the raw-window-handle 0.6
# trait impls wgpu needs.
[target.'cfg(not(target_os = "linux"))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# buffr-modal's `bridge` feature owns its own toolkit-agnostic
# KeyEvent / KeyCode / Modifiers / KeyState types (same shape as
# wayr's, but with no wayr dep). The windowing/other backend
# constructs these from winit events; main.rs routes them through
# `bridge_key_event_to_chord` (cfg-gated alias to the same symbol
# `key_event_to_chord` used on Linux).
buffr-modal = { workspace = true, features = ["bridge"] }
# Used by windowing/other/ime.rs for ContentHint flags. Linux gets
# bitflags transitively through wayr; non-linux pulls it directly.
bitflags.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
