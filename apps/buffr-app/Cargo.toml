[package]
name = "buffr-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Vim-inspired browser. Native, GPU-accelerated. Rust + CEF."
# Browser binary. `buffr` (supervisor) spawns this as its child process.
publish = false

[[bin]]
name = "buffr-app"
path = "src/main.rs"


[dependencies]
buffr-engine.workspace = true
buffr-cef.workspace = true
buffr-core.workspace = true
buffr-history.workspace = true
buffr-bookmarks.workspace = true
buffr-downloads.workspace = true
buffr-zoom.workspace = true
buffr-permissions = { workspace = true, features = ["store"] }
# Enable the `wayr` feature so we can pull in
# `buffr_modal::wayr_key_event_to_chord` to translate wayr key events
# into our internal chord type. (Was `winit` before Phase C of the
# migration to kryptic-sh/wayr.)
buffr-modal = { workspace = true, features = ["wayr"] }
buffr-ui.workspace = true
buffr-config.workspace = true
hjkl-splash.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Wayland-only windowing toolkit. Replaces winit; see CHANGELOG.
# 0.1.4 makes Toplevel Send + Sync + 'static and adds HasDisplayHandle
# so wgpu can hold Arc<Toplevel> via its safe surface-creation path
# (fixes shutdown SIGSEGV). 0.1.3 dedupes spurious Resized on focus
# changes. 0.1.2 filters ASCII control chars from KeyEvent::text.
# 0.1.1 fixed request_redraw being a no-op. All are required.
wayr = { version = "0.1.10", features = ["subsurface", "text-input", "cursor-shape", "fractional-scale", "xdg-activation", "presentation-time"] }
raw-window-handle.workspace = true
clap.workspace = true
tempfile.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
ctrlc = "3.5.2"
interprocess = "2"
sha2 = "0.11"
hex = "0.4"
globset = "0.4"
url.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
