[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Build automation tasks for buffr (cargo xtask ...)."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[package.metadata.cargo-machete]
ignored = []

[dependencies]
anyhow.workspace = true
ureq.workspace = true
serde.workspace = true
tar.workspace = true
bzip2.workspace = true
# SHA-1 is the only digest the Spotify CEF `index.json` publishes, so the
# integrity check on the ~200 MB tarball has to match it. Not used for
# anything security-critical beyond "did the CDN hand us the bytes the
# index says it would".
sha1.workspace = true
