[package]
name = "buffr-blitz"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Blitz backend for buffr-engine"
publish = false

[dependencies]
buffr-engine.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Blitz pure-Rust browser engine — Stylo (CSS) + Taffy (flex/grid layout) + Vello (GPU render).
#
# wgpu version conflict note
# ──────────────────────────
# The workspace pins wgpu = "29".  The rendering layer (anyrender_vello) requires
# wgpu ^28, which Cargo cannot unify with ^29.  To avoid forcing a workspace-wide
# wgpu downgrade we intentionally omit blitz-paint/blitz-renderer-vello/blitz-shell
# (and the anyrender_vello renderer) from Phase B.
#
# What we DO pull in (no wgpu dep):
#   blitz-dom   — DOM tree, Stylo CSS, Taffy layout   (no wgpu)
#   blitz-html  — HTML5 parser bridge                 (no wgpu)
#   blitz-traits — shared trait surface               (no wgpu)
#
# OSR rendering: placeholder solid-colour fill into SharedOsrFrame until
# anyrender_vello or a custom wgpu ^29 backend is wired in Phase C.
blitz-dom = "=0.3.0-alpha.2"
blitz-html = "=0.3.0-alpha.2"
blitz-traits = "=0.3.0-alpha.2"
# Input event translation — versions must match blitz-traits 0.3.0-alpha.2.
keyboard-types = "0.7"
smol_str = "0.3"
# Synchronous HTTP fetcher for initial HTML load.
ureq.workspace = true
