[package]
name = "buffr-blitz"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Blitz backend for buffr-engine"
publish = false

[dependencies]
buffr-engine.workspace = true
buffr-modal.workspace = true
hjkl-clipboard.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Blitz pure-Rust browser engine — Stylo (CSS) + Taffy (flex/grid layout) + Vello (CPU render).
#
# Renderer strategy
# ─────────────────
# The workspace pins wgpu = "29".  The GPU rendering layer (anyrender_vello)
# requires wgpu ^28, which Cargo cannot unify with ^29.
#
# Instead we use anyrender_vello_cpu — a pure-CPU rasterizer with NO wgpu
# dependency.  anyrender_vello_cpu 0.10 requires anyrender ^0.8, which matches
# blitz-paint 0.3.0-alpha.2.  This gets real rendered pixels into SharedOsrFrame
# with no GPU and no version conflict.
#
# What we pull in:
#   blitz-dom          — DOM tree, Stylo CSS, Taffy layout   (no wgpu)
#   blitz-html         — HTML5 parser bridge                 (no wgpu)
#   blitz-traits       — shared trait surface               (no wgpu)
#   blitz-paint        — paint_scene(PaintScene, BaseDocument, ...) bridge
#   anyrender_vello_cpu — VelloCpuImageRenderer (no wgpu)
blitz-dom = "=0.3.0-alpha.2"
blitz-html = "=0.3.0-alpha.2"
blitz-traits = "=0.3.0-alpha.2"
blitz-paint = "=0.3.0-alpha.2"
# anyrender_vello_cpu 0.10 requires anyrender ^0.8; we depend on anyrender
# directly to bring the ImageRenderer trait into scope.
anyrender = "0.8"
anyrender_vello_cpu = "0.10"
# Input event translation — versions must match blitz-traits 0.3.0-alpha.2.
keyboard-types = "0.7"
smol_str = "0.3"
# CursorIcon type used by ShellProvider::set_cursor — must match blitz-traits' dep.
cursor-icon = "1.2"
# Synchronous HTTP fetcher for initial HTML load.
ureq.workspace = true
