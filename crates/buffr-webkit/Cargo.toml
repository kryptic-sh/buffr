[package]
name = "buffr-webkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "WPE WebKit (Linux native) backend for buffr-engine — phase 1 scaffold"
publish = false

[dependencies]
buffr-core.workspace = true
buffr-engine.workspace = true
buffr-history.workspace = true
buffr-downloads.workspace = true
buffr-config.workspace = true
tracing.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.22"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"

[build-dependencies]
# pkg-config finds wpe-webkit-2.0 + wpe-platform-2.0; bindgen generates
# unified FFI bindings for both umbrellas.
pkg-config = "0.3"
bindgen = "0.71"
