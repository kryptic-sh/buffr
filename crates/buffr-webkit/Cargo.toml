[package]
name = "buffr-webkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kryptic-sh/buffr"
homepage = "https://kryptic.sh"
authors = ["mxaddict <mxaddict@kryptic.sh>"]
description = "WPE WebKit (Linux native) backend for buffr-engine — phase 1 scaffold"
publish = false

[package.metadata.cargo-machete]
ignored = []

[dependencies]
buffr-core = { path = "../buffr-core" }
buffr-engine = { path = "../buffr-engine" }
buffr-permissions = { path = "../buffr-permissions", default-features = false }
serde_json = "1"
buffr-modal = { path = "../buffr-modal" }
buffr-downloads = { path = "../buffr-downloads" }
hjkl-clipboard = "0.5"
tracing = "0.1"
thiserror = "2"
ureq = { version = "3" }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.22"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"

[build-dependencies]
# pkg-config finds wpe-webkit-2.0 + wpe-platform-2.0; bindgen generates
# unified FFI bindings for both umbrellas. cc compiles the small C bridge
# (src/platform/wpe_subclasses.c) that defines BuffrDisplay/View/Toplevel
# as GObject subclasses — Rust would otherwise have to hand-roll the
# WPEDisplayClass/WPEViewClass layouts that bindgen emits as opaque.
pkg-config = "0.3"
bindgen = "0.71"
cc = "1"
