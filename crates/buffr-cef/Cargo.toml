[package]
name = "buffr-cef"
description = "CEF integration and browser host for buffr."
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# Off-screen rendering path (Linux default; always compiled in).
osr = []

[dependencies]
cef = "148"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
hjkl-config.workspace = true
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
ureq = { version = "3", features = ["json"] }
semver = { version = "1", features = ["serde"] }
buffr-core.workspace = true
buffr-engine.workspace = true
buffr-modal.workspace = true
buffr-history.workspace = true
buffr-downloads.workspace = true
buffr-config.workspace = true
buffr-zoom.workspace = true
buffr-permissions = { workspace = true, features = ["store"] }
buffr-view-source.workspace = true
hjkl-clipboard.workspace = true
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-dlopen", "wayland-csd-adwaita", "rwh_06"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }
base64 = "0.22"
url = "2"
rusqlite = { version = "0.39", features = ["bundled"] }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-sys = { version = "0.31", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
toml = "1.1"
