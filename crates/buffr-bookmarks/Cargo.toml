[package]
name = "buffr-bookmarks"
description = "SQLite-backed bookmarks store for buffr."
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# `functions` registers the `buffr_lower` scalar used by `search` —
# SQLite's built-in `lower()` is ASCII-only, and search has always been
# Unicode-case-insensitive via Rust's `str::to_lowercase`.
rusqlite = { workspace = true, features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
chrono = { workspace = true, features = ["serde", "clock"] }
url = "2"
regex.workspace = true
buffr-store = { workspace = true, features = ["chrono"] }
