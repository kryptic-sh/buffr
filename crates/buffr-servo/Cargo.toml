[package]
name = "buffr-servo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kryptic-sh/buffr"
homepage = "https://buffr.kryptic.sh"
authors = ["mxaddict <mxaddict@kryptic.sh>"]
description = "Servo backend for buffr-engine"
publish = false

# buffr-servo is intentionally OUTSIDE the buffr umbrella workspace
# (see ../../Cargo.toml `[workspace.exclude]`). servo 0.1.0 pins
# stylo 0.15; blitz-dom 0.3-alpha.2 (used by buffr-blitz) pins
# stylo 0.16. Both are `links = "servo_style_crate"`. Sharing a
# single Cargo.lock is impossible. Keeping this crate standalone
# lets its dep graph resolve independently.
#
# Build: cargo build --manifest-path crates/buffr-servo/Cargo.toml

[dependencies]
buffr-engine = { path = "../buffr-engine" }
thiserror = "2"
tracing = "0.1"

# Real Servo embedding API. Released to crates.io 2026-04-13 as the
# `servo` crate at v0.1.0 (LTS). MSRV 1.86 (workspace pins 1.95).
servo = "0.1"

# buffr-engine path-depends on buffr-permissions / buffr-modal via
# registry pins for its standalone CI. Force the resolver to pick up the
# local in-tree versions instead — keeps our submodule-pointer changes
# visible without needing a crates.io publish.
[patch.crates-io]
buffr-permissions = { path = "../buffr-permissions" }
buffr-modal = { path = "../buffr-modal" }
