[package]
name = "buffr-webview2"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "WebView2 (Windows) backend for buffr-engine"
publish = false

[dependencies]
buffr-core.workspace = true
buffr-downloads.workspace = true
buffr-engine.workspace = true
buffr-history.workspace = true
buffr-modal.workspace = true
hjkl-clipboard.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# PNG decode for CapturePreview OSR pipeline — same version + features
# across the workspace so the dep is deduplicated in the build graph.
# Also used to decode fetched favicon bytes into RGBA pixels.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "webp"] }
# HTTP client for fetching favicon URLs from the STA thread's spawned worker.
# Same version as buffr-cef to deduplicate in the workspace build graph.
ureq = { version = "3", features = ["json"] }
# Windows API bindings — feature set covers COM, WinRT, D3D11, DXGI, and
# the Composition / Visual-layer APIs needed for composition-hosted WebView2.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # SetFocus (keyboard focus before PostMessageW key events)
    "Win32_UI_Input_KeyboardAndMouse",
    # WM_MOUSELEAVE constant lives in Win32_UI_Controls
    "Win32_UI_Controls",
    # Clipboard: OpenClipboard / GetClipboardData / SetClipboardData
    "Win32_System_DataExchange",
    # GlobalAlloc / GlobalLock / GlobalUnlock / GMEM_MOVEABLE
    "Win32_System_Memory",
    # CF_UNICODETEXT constant
    "Win32_System_Ole",
] }
# WebView2 COM bindings generated from the official WebView2 SDK IDL.
webview2-com = "0.39"
webview2-com-sys = "0.39"
