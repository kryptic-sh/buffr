[package]
name = "buffr-webview2"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "WebView2 (Windows) backend for buffr-engine"
publish = false

[dependencies]
buffr-engine.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# PNG decode for CapturePreview OSR pipeline — same version + features as
# buffr-blink-cdp so the dep is deduplicated in the workspace build graph.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Windows API bindings — feature set covers COM, WinRT, D3D11, DXGI, and
# the Composition / Visual-layer APIs needed for composition-hosted WebView2.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
# WebView2 COM bindings generated from the official WebView2 SDK IDL.
webview2-com = "0.39"
webview2-com-sys = "0.39"
