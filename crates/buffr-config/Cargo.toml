[package]
name = "buffr-config"
description = "Config loading and parsing for buffr."
version = "0.4.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kryptic-sh/buffr-config"
homepage = "https://buffr.kryptic.sh"
authors = ["mxaddict <mxaddict@kryptic.sh>"]
readme = "README.md"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
hjkl-config.workspace = true
notify = "8"
url = "2"
buffr-modal.workspace = true

[dev-dependencies]
tempfile = "3"
