[package]
name = "buffr-modal"
description = "Vim-style modal keybinding engine for buffr."
version = "0.1.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Bring in the winit `KeyEvent` → `KeyChord` adapter so embedding apps
# can wire raw key events into the engine without re-implementing the
# mapping. Optional because the engine itself is winit-agnostic.
winit = ["dep:winit"]
# Bring in the wayr `KeyEvent` → `KeyChord` adapter. Parallel to the
# `winit` feature; pulls in `wayr` instead. `buffr-app` enables this
# on Linux where the wayr windowing toolkit is the backend.
wayr = ["dep:wayr"]
# Bring in the toolkit-agnostic bridge `KeyEvent` → `KeyChord`
# adapter. The bridge types are defined locally in `bridge_adapter`
# (same shape as wayr's but no `wayr` dep), so this feature compiles
# on platforms where wayr's wayland-client transitive can't link
# (macOS / Windows). buffr-app enables this on non-Linux.
bridge = []

[package.metadata.cargo-machete]
ignored = []

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bitflags = "2"

# Edit-mode delegates to hjkl-engine against a mirrored Rope synced to
# the DOM via CEF. Bumped to 0.5/0.6 — the public API used here
# (Editor, Host, Buffer, Viewport) is fully additive across 0.1→0.5/0.6.
hjkl-engine.workspace = true
hjkl-buffer.workspace = true

# crossterm KeyEvent is the engine's input type today; the host
# bridges from CEF browser keys into it. When trait extraction lands a
# host-native Input enum, this dep moves out.
crossterm = "0.29.0"

# Optional: only enabled by the `winit` feature. Used by the
# `winit_adapter` module that converts `winit::event::KeyEvent` into
# our internal `KeyChord`. The engine itself stays winit-agnostic.
# Only the `winit_adapter` module pulls winit, and only to translate
# `winit::event::KeyEvent` → our `KeyChord`. We don't drive the event
# loop or create surfaces here, so we strip all platform backends —
# `wayland` / `x11` would force a pkg-config wayland probe on
# macOS/Windows CI runners that have no Wayland headers. Consumers
# that drive a winit event loop bring their own winit dep with the
# backend features they need.
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06"] }

# Optional: only enabled by the `wayr` feature. Used by the
# `wayr_adapter` module — parallel to `winit_adapter`.
wayr = { version = "0.2", optional = true }

[dev-dependencies]
toml = "1.1"
