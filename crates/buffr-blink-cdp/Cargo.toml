[package]
name = "buffr-blink-cdp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kryptic-sh/buffr-blink-cdp"
description = "Headless Chromium CDP backend for buffr-engine (Phase 4 spike)"

[dependencies]
buffr-engine = { version = "0.1", path = "../buffr-engine" }
buffr-permissions = "0.1"
buffr-downloads = "0.1"
buffr-core = "0.6"
tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "3", features = ["json"] }
open = "5"
