[package]
name = "buffr-engine"
description = "Engine-agnostic browser trait + neutral types for buffr."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22"
getrandom = "0.2"
# raw-window-handle 0.6 lets backends accept a host wl_surface for native
# subsurface compositing (Phase 3 of the WPE WebKit umbrella, #109). Type-
# only crate; no transitive runtime weight.
raw-window-handle = "0.6"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
buffr-modal.workspace = true
# Only pulls the `Capability` / `Decision` type surface. The SQLite store
# is gated behind buffr-permissions' `store` feature, which we don't
# enable — keeps rusqlite out of buffr-engine's transitive closure so
# other crates can opt into a different rusqlite feature set.
buffr-permissions.workspace = true
