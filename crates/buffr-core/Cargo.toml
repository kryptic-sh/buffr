[package]
name = "buffr-core"
description = "Engine-agnostic browser shell for buffr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
ignored = []

[features]
# Off-screen rendering path (Linux default; always compiled in).
osr = []

[dependencies]
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { workspace = true, features = ["serde", "clock"] }
ureq = { version = "3", features = ["json"] }
semver.workspace = true
getrandom.workspace = true
buffr-engine.workspace = true
buffr-config.workspace = true
hjkl-clipboard.workspace = true
# Image decode / re-encode for context-menu "Copy Image"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }
base64 = "0.23"
url = "2"
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-sys = { version = "0.31", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
toml.workspace = true
