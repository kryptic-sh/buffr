[package]
name = "buffr-webkit-cocoa"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "WKWebView (macOS) backend for buffr-engine"
publish = false

[dependencies]
buffr-engine.workspace = true
buffr-modal.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSError"] }
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSGraphicsContext",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKWebView",
    "WKWebViewConfiguration",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKUIDelegate",
    "WKSnapshotConfiguration",
    "block2",
] }
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
