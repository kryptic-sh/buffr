# Phase 4 demo config: CEF default + blink-cdp second backend
#
# Routes example.com through the headless-Chromium CDP backend.
# Everything else uses CEF.
#
# Requirements:
#   - chromium, google-chrome, or chromium-browser on PATH
#   - (Linux) or Google Chrome on macOS
#
# Usage:
#   BUFFR_CONFIG=examples/blink-cdp-demo-config.toml buffr
#
# Note: Phase 4 blink-cdp limitations:
#   - ~5 FPS OSR paint (captureScreenshot poll; no startScreencast)
#   - No popup windows
#   - No hint-mode, find-in-page, zoom, devtools, scheme handlers
#   - No audio/video activity detection
#   - Single port (9222) — only one blink-cdp instance supported

[engines]
default = "cef"

[[engines.instances]]
id      = "cef"
backend = "cef"

[[engines.instances]]
id       = "blink-cdp"
backend  = "blink-cdp"
data_dir = "~/.cache/buffr/blink-cdp"

[[engines.rules]]
match  = "*.example.com"
engine = "blink-cdp"

[[engines.rules]]
match  = "example.com"
engine = "blink-cdp"
