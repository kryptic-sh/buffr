[graph]
all-features = true
# Restrict the graph to the platforms we actually ship binaries for.
# Without this, cargo-deny pulls every transitive dep across every
# target in Cargo.lock — including big Windows/CEF subtrees that are
# cfg-gated and never built on Linux CI.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is unmaintained but has no known vulnerabilities. Transitive
  # via ratatui → hjkl-buffer → buffr-modal.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",          # libbz2-rs-sys (bzip2 license — permissive, used for CEF tarballs)
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
