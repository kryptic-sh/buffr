# mdBook configuration for buffr's docs site.
#
# Generates a static HTML site from `docs/site/*.md`. The rendered output
# lives in `docs-site/` (gitignored target dir) and is published to
# `https://buffr.kryptic.sh/` by this repo's own Pages workflow.
#
# It used to be built by the kryptic.sh site instead, which checked this
# repo out and ran `mdbook build` while assembling the unified site. That
# meant a broken `SUMMARY.md` link here failed the *website's* deploy
# rather than the pull request that caused it, and the docs only went live
# on the website's daily cron. The build now lives with the docs.
#
# `docs/site/CNAME` is the custom domain; mdBook copies non-chapter files out
# of `src` into the build directory, and the workflow checks it arrived.
#
# Run locally:
#   mdbook build       -> emits HTML into docs-site/
#   mdbook serve       -> live-reload at http://localhost:3000

[book]
title = "buffr"
description = "Vim-modal browser. Native shell, GPU-accelerated compositing via CEF."
authors = ["mxaddict <mxaddict@kryptic.sh>"]
language = "en"
src = "docs/site"
multilingual = false

[build]
build-dir = "docs-site"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/kryptic-sh/buffr"
edit-url-template = "https://github.com/kryptic-sh/buffr/edit/main/{path}"
# Served at the domain root now, not under a /buffr/docs/ prefix.
site-url = "/"


# The book lived at www.kryptic.sh/buffr/docs/ until it moved here. GitHub
# redirects www.kryptic.sh/buffr/<path> to buffr.kryptic.sh/<path>, so every
# old link arrives as /docs/... and would 404 against a book served at the
# root. One entry per chapter, so a bookmark to a specific page still lands
# on that page rather than the index.
[output.html.redirect]
"/docs/index.html" = "/index.html"
"/docs/README.html" = "/index.html"
"/docs/accessibility.html" = "/accessibility.html"
"/docs/backlog.html" = "/backlog.html"
"/docs/config.html" = "/config.html"
"/docs/context-menu.html" = "/context-menu.html"
"/docs/dev.html" = "/dev.html"
"/docs/hint-mode.html" = "/hint-mode.html"
"/docs/keymap.html" = "/keymap.html"
"/docs/macos-running.html" = "/macos-running.html"
"/docs/macos-signing.html" = "/macos-signing.html"
"/docs/multi-tab.html" = "/multi-tab.html"
"/docs/packaging.html" = "/packaging.html"
"/docs/privacy.html" = "/privacy.html"
"/docs/ui-stack.html" = "/ui-stack.html"
"/docs/updates.html" = "/updates.html"
"/docs/windows-packaging.html" = "/windows-packaging.html"
